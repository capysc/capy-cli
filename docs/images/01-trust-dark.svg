<svg xmlns="http://www.w3.org/2000/svg" width="368" height="192" class="svgbob">
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: white;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: white;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: transparent;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

.svgbob .filled {
  fill: white;
}

.svgbob .bg_filled {
  fill: transparent;
  stroke-width: 1;
}

.svgbob .nofill {
  fill: transparent;
}

.svgbob .end_marked_arrow {
  marker-end: url(#arrow);
}

.svgbob .start_marked_arrow {
  marker-start: url(#arrow);
}

.svgbob .end_marked_diamond {
  marker-end: url(#diamond);
}

.svgbob .start_marked_diamond {
  marker-start: url(#diamond);
}

.svgbob .end_marked_circle {
  marker-end: url(#circle);
}

.svgbob .start_marked_circle {
  marker-start: url(#circle);
}

.svgbob .end_marked_open_circle {
  marker-end: url(#open_circle);
}

.svgbob .start_marked_open_circle {
  marker-start: url(#open_circle);
}

.svgbob .end_marked_big_open_circle {
  marker-end: url(#big_open_circle);
}

.svgbob .start_marked_big_open_circle {
  marker-start: url(#big_open_circle);
}

</style>
  <defs>
    <marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 0,4 4,2 0,0"></polygon>
    </marker>
    <marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,2 2,0 4,2 2,4 0,2"></polygon>
    </marker>
    <marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="filled"></circle>
    </marker>
    <marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="2" class="bg_filled"></circle>
    </marker>
    <marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <circle cx="4" cy="4" r="3" class="bg_filled"></circle>
    </marker>
  </defs>
  <rect class="backdrop" x="0" y="0" width="368" height="192"></rect>
  <text x="42" y="28" >Your</text>
  <text x="82" y="28" >machine</text>
  <text x="242" y="28" >Capy</text>
  <text x="282" y="28" >service</text>
  <text x="34" y="60" >seed</text>
  <text x="74" y="60" >phrase</text>
  <text x="234" y="60" >identities</text>
  <text x="34" y="76" >master</text>
  <text x="90" y="76" >key</text>
  <text x="234" y="76" >memberships</text>
  <text x="34" y="92" >project</text>
  <text x="98" y="92" >keys</text>
  <text x="234" y="92" >ciphertext</text>
  <text x="34" y="108" >inner</text>
  <text x="82" y="108" >wrap</text>
  <text x="122" y="108" >key</text>
  <text x="234" y="108" >outer</text>
  <text x="282" y="108" >wrap</text>
  <text x="146" y="140" >co-decrypt</text>
  <text x="130" y="172" >needs</text>
  <text x="178" y="172" >both</text>
  <text x="218" y="172" >halves</text>
  <g>
    <line x1="20" y1="8" x2="156" y2="8" class="solid"></line>
    <line x1="20" y1="8" x2="20" y2="120" class="solid"></line>
    <line x1="156" y1="8" x2="156" y2="120" class="solid"></line>
    <line x1="20" y1="40" x2="156" y2="40" class="solid"></line>
    <line x1="20" y1="120" x2="156" y2="120" class="solid"></line>
    <line x1="92" y1="120" x2="92" y2="152" class="solid"></line>
    <line x1="220" y1="8" x2="356" y2="8" class="solid"></line>
    <line x1="220" y1="8" x2="220" y2="120" class="solid"></line>
    <line x1="356" y1="8" x2="356" y2="120" class="solid"></line>
    <line x1="220" y1="40" x2="356" y2="40" class="solid"></line>
    <line x1="220" y1="120" x2="356" y2="120" class="solid"></line>
    <line x1="284" y1="120" x2="284" y2="152" class="solid"></line>
    <line x1="92" y1="152" x2="284" y2="152" class="solid"></line>
  </g>
</svg>