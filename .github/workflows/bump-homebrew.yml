name: Bump Homebrew formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.1). If blank, uses the release event tag.'
        required: false

jobs:
  bump:
    # Skip pre-releases — they shouldn't push to the stable tap.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      # npm sometimes lags a release event by a few seconds. Give it a
      # breather before brew bump-formula-pr fetches the tarball.
      - name: Wait for npm to propagate
        run: sleep 60

      - name: Bump capy formula
        uses: dawidd6/action-homebrew-bump-formula@v5
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: capysc/homebrew-tap
          formula: capy
          tag: ${{ inputs.tag || github.event.release.tag_name }}
