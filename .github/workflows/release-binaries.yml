name: Release binaries

# Cross-platform standalone binaries (Node runtime bundled via @yao-pkg/pkg) so
# `capy` runs on Python / PHP / Ruby / Go deploy targets without Node installed.
# Runs after a GitHub Release is published (the same trigger as bump-homebrew),
# builds all five targets on a single Ubuntu runner, and uploads the archives +
# checksums as assets on that release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. v0.6.1)'
        required: true

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # SignPath reads this job and downloads the unsigned artifact
    steps:
      - name: Resolve tag + version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      # ldid lets us pseudo-sign Mach-O binaries on Linux, so we cross-build the
      # macOS targets without a Mac runner. See MOZGIII/install-ldid-action.
      - name: Install ldid (macOS cross-sign)
        uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag version ${{ steps.version.outputs.version }} != package.json $PKG_VERSION"
            exit 1
          fi

      # Regenerated from the exact dependency tree that is about to be bundled,
      # so the notices shipped in the archives match the code in the binary.
      - name: Regenerate third-party notices
        run: bun run notices

      - name: Bundle CLI with esbuild
        run: bun run bundle

      # pkg builds capy.exe on top of Node's node.exe, which says "Node.js" in
      # its Windows version info. Write a copy that says Capy and this
      # version into a private pkg cache, used only for the Windows target.
      # See scripts/windows/prepare-node-base.ts.
      - name: Brand the Windows Node base
        run: bun scripts/windows/prepare-node-base.ts --version "${{ steps.version.outputs.version }}" --cache .pkg-cache-win

      - name: Build cross-platform binaries
        working-directory: build
        run: |
          set -euo pipefail
          PKG="../node_modules/.bin/pkg"
          mkdir -p ../bin-pkg
          $PKG . --public-packages "*" --public --target node22-macos-x64        --output ../bin-pkg/capy-darwin-x64/capy
          $PKG . --public-packages "*" --public --target node22-macos-arm64      --output ../bin-pkg/capy-darwin-arm64/capy
          $PKG . --public-packages "*" --public --target node22-linuxstatic-x64  --output ../bin-pkg/capy-linux-x64/capy
          $PKG . --public-packages "*" --public --target node22-linuxstatic-arm64 --output ../bin-pkg/capy-linux-arm64/capy
          PKG_CACHE_PATH=../.pkg-cache-win \
          $PKG . --public-packages "*" --public --target node22-win-x64          --output ../bin-pkg/capy-win-x64/capy.exe

      # Code signing through the SignPath Foundation. Off until the SignPath
      # organization is set up: set the repository variables
      # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
      # (and optionally SIGNPATH_ARTIFACT_CONFIGURATION_SLUG) plus the secret
      # SIGNPATH_API_TOKEN. Every request waits for a person to approve it in
      # SignPath (Foundation rule), so this step blocks until then. Signing
      # happens before the zip and checksums are made, so both cover the
      # signed exe.
      - name: Upload unsigned capy.exe for signing
        id: unsigned-exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: capy-win-x64-unsigned
          path: bin-pkg/capy-win-x64/capy.exe
          if-no-files-found: error

      - name: Sign capy.exe with SignPath (waits for approval)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          connector-url: ${{ vars.SIGNPATH_CONNECTOR_URL || 'https://githubactions.connector.signpath.io' }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: bin-pkg/capy-win-x64-signed

      - name: Use the signed capy.exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          set -euo pipefail
          test -s bin-pkg/capy-win-x64-signed/capy.exe
          mv -f bin-pkg/capy-win-x64-signed/capy.exe bin-pkg/capy-win-x64/capy.exe
          rm -rf bin-pkg/capy-win-x64-signed

      - name: Package archives + checksums
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          # The binaries embed our AGPL code plus MIT/ISC/BSD/Apache dependencies;
          # both sets of terms ship inside every archive.
          for d in bin-pkg/*/; do
            cp LICENSE THIRD-PARTY-NOTICES.md "$d"
          done
          cd bin-pkg
          for d in capy-darwin-x64 capy-darwin-arm64 capy-linux-x64 capy-linux-arm64; do
            tar -czf "../dist/${d}-${VERSION}.tar.gz" -C "$d" .
          done
          (cd capy-win-x64 && zip "../../dist/capy-win-x64-${VERSION}.zip" capy.exe LICENSE THIRD-PARTY-NOTICES.md)
          cd ../dist
          shasum -a 256 *.tar.gz *.zip > "checksums-${VERSION}.txt"
          ls -la

      # install.sh and install.ps1 are generated from the templates in
      # scripts/install with this release's version, this commit and the
      # checksums just written, then published next to the archives.
      - name: Generate install scripts
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          bun scripts/install/build-install-scripts.ts \
            --version "$VERSION" \
            --commit "$(git rev-parse HEAD)" \
            --checksums "dist/checksums-${VERSION}.txt" \
            --out dist

      - name: Smoke-test linux-x64 binary in python:3.12-slim (no Node)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/dist:/dist:ro" \
            python:3.12-slim \
            bash -c "set -e && cd /tmp && tar xzf /dist/capy-linux-x64-${{ steps.version.outputs.version }}.tar.gz && ./capy --version"

      - name: Upload binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums-*.txt
            dist/install.sh
            dist/install.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs the script as published for this tag, the way a user would, in a
      # clean container with no Node.
      - name: Smoke-test the published installer in alpine (no Node)
        run: |
          docker run --rm \
            -e TAG="${{ steps.version.outputs.tag }}" \
            -e VERSION="${{ steps.version.outputs.version }}" \
            alpine:3 \
            sh -c 'set -eu && wget -qO- "https://github.com/capysc/capy-cli/releases/download/$TAG/install.sh" | sh && test "$(capy --version)" = "$VERSION"'

  # Installs this release on a real Windows machine with Windows PowerShell 5.1
  # (the version built into Windows), the way a user would, and checks the exe
  # runs, says Capy in its version info, and is signed once signing is on.
  smoke-windows:
    needs: build-binaries
    runs-on: windows-latest
    steps:
      - name: Install with Windows PowerShell 5.1 and run capy
        shell: powershell
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EXPECT_SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.TrimStart('v')
          Invoke-RestMethod "https://github.com/capysc/capy-cli/releases/download/$env:TAG/install.ps1" | Invoke-Expression
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Capy\bin\capy.exe'
          $printed = (& $exe --version | Out-String).Trim()
          if ($printed -ne $version) { throw "capy --version printed '$printed', expected '$version'" }
          $info = (Get-Item -LiteralPath $exe).VersionInfo
          if ($info.ProductName -ne 'Capy' -or $info.ProductVersion -ne $version) {
            throw "capy.exe version info says '$($info.ProductName) $($info.ProductVersion)', expected 'Capy $version'"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          Write-Host "Signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          if ($env:EXPECT_SIGNED -eq 'true' -and $signature.Status -ne 'Valid') {
            throw "capy.exe signature is $($signature.Status), expected Valid"
          }

  # Opens the winget-pkgs update PR for this release. Off until the first
  # version is in winget (submitted by hand, see docs/windows-release.md):
  # set the repository variable WINGET_IDENTIFIER and the secret WINGET_TOKEN
  # (classic token with public_repo, owner of a winget-pkgs fork).
  winget:
    needs: smoke-windows
    if: vars.WINGET_IDENTIFIER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ${{ vars.WINGET_IDENTIFIER }}
          release-tag: ${{ github.event.release.tag_name || inputs.tag }}
          installers-regex: '-win-x64-[0-9.]+\.zip$'
          fork-user: ${{ vars.WINGET_FORK_USER || github.repository_owner }}
          token: ${{ secrets.WINGET_TOKEN }}
