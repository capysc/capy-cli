name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Builds capy.exe the way release-binaries.yml does and runs it on Windows,
  # so a change to the Windows build (branded Node base, pkg) is caught on the
  # PR rather than on release day.
  windows-binary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Typecheck Windows build script
        run: bun run typecheck:windows

      - name: Build capy.exe with Capy's version info
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          bun run bundle
          bun scripts/windows/prepare-node-base.ts --version "$VERSION" --cache .pkg-cache-win
          cd build
          PKG_CACHE_PATH=../.pkg-cache-win ../node_modules/.bin/pkg . --public-packages "*" --public --target node22-win-x64 --output ../build-win/capy.exe

      - name: Run capy.exe and check its version info
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = Resolve-Path 'build-win\capy.exe'
          $printed = (& $exe --version | Out-String).Trim()
          if ($printed -ne $version) { throw "capy --version printed '$printed', expected '$version'" }
          $info = (Get-Item -LiteralPath $exe).VersionInfo
          Write-Host "ProductName=$($info.ProductName) ProductVersion=$($info.ProductVersion) CompanyName=$($info.CompanyName)"
          if ($info.ProductName -ne 'Capy' -or $info.ProductVersion -ne $version) {
            throw "capy.exe version info says '$($info.ProductName) $($info.ProductVersion)', expected 'Capy $version'"
          }
          & $exe --help | Select-Object -First 3

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The keep.lock merge driver tests compare the driver's result with git's
      # own text merge, byte for byte. That needs the conflict label
      # placeholders (%S %X %Y), which git expands from 2.44 on. A runner image
      # with an older git gets the current one from the git maintainers' PPA.
      - name: Git 2.44 or newer
        run: |
          need=2.44.0
          have() { git version | awk '{print $3}'; }
          new_enough() { [ "$(printf '%s\n' "$need" "$(have)" | sort -V | head -n1)" = "$need" ]; }
          if ! new_enough; then
            sudo add-apt-repository -y ppa:git-core/ppa
            sudo apt-get update -q
            sudo apt-get install -y -q git
          fi
          git version
          new_enough

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck install script generator
        run: bun run typecheck:install

      # `capy run` tests spawn `node dist/index.js` as a subprocess — build
      # the dist artifact before the test step so those 14 tests can find it.
      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Release authentication tests
        run: bun run test:release

      - name: Homebrew release publication tests
        run: bun run test:homebrew

      # Embedded browser screens: dependency freeze + no external URLs +
      # __CAPY_DATA__ placeholders intact.
      - name: Screen checks
        run: bun run check:screens
