name: CI

on:
  pull_request:
    # feat/portability is a long-lived integration branch that PRs land into
    # before it reaches main. Without it here, build+test never runs on those
    # PRs and only the security scan reports back.
    branches: [main, feat/portability]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: latchkey-small

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      # `capy run` tests spawn `node dist/index.js` as a subprocess — build
      # the dist artifact before the test step so those 14 tests can find it.
      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # Embedded browser screens: dependency freeze + no external URLs +
      # __CAPY_DATA__ placeholders intact.
      - name: Screen checks
        run: bun run check:screens
